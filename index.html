<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Łabiszyńska Liga Orlikowa</title>
    <style>
        /* Style do tabeli */
        body {
            font-family: Arial, sans-serif;
            background-color: #3399ff;
            color: #000;
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #e6f2ff;
            margin-bottom: 30px;
        }
        th, td {
            border: 1px solid #000;
            padding: 8px;
            text-align: center;
        }
        tr:nth-child(even) {
            background-color: #cce0ff;
        }
        tr:nth-child(odd) {
            background-color: #b3d1ff;
        }
    </style>
</head>
<body>
    <h1>Łabiszyńska Liga Orlikowa - Tabela</h1>

    <table id="league-table">
        <tr>
            <th>#</th>
            <th>Drużyna</th>
            <th>Mecze</th>
            <th>Punkty</th>
            <th>Zwycięstwa</th>
            <th>Remisy</th>
            <th>Porażki</th>
            <th>Bramki zdobyte</th>
            <th>Bramki stracone</th>
            <th>Bilans</th>
        </tr>
        <!-- Tutaj dynamicznie wstawiane będą wiersze tabeli -->
    </table>

    <button id="submit-btn">Zapisz zmiany</button>

    <script src="app.js"></script>  <!-- Połączenie z plikiem JavaScript -->
</body>
</html>
